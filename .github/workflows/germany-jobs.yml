name: Rebuild Germany jobs page
on:
  schedule:
    - cron: "40 4 * * *"   # daily
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python -m unittest discover -s tests
      - run: python scripts/build_germany_jobs.py
      - name: Commit page
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add jobs-in-germany/index.html data/germany-jobs.json data/germany-jobs-translations.json
          git diff --staged --quiet || git commit -m "chore: rebuild Germany jobs page"
          git pull --rebase && git push
