name: Sync Apify catalog
on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync_catalog.py"
      - ".github/workflows/sync-catalog.yml"
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Sync catalog JSON
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_USER: benthepythondev
        run: python scripts/sync_catalog.py
      - name: Commit feed
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data/actors.json
          git diff --staged --quiet || git commit -m "chore: sync public Apify catalog"
          git push
