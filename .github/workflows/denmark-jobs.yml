name: Rebuild Denmark jobs page
on:
  schedule:
    - cron: "10 5 * * *"   # daily
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python -m unittest discover -s tests
      - run: python scripts/build_denmark_jobs.py
      - name: Commit page
        if: always()
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add jobs-in-denmark/index.html data/denmark-jobs.json data/denmark-ats.json
          git diff --staged --quiet || git commit -m "chore: rebuild Denmark jobs page"
          git pull --rebase && git push
