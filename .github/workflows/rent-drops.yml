name: Weekly US metro rent-drop snapshot
on:
  schedule:
    - cron: "30 6 * * 4"   # weekly, Thursday 06:30 UTC
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require the Listingrail key
        env:
          LISTINGRAIL_API_KEY: ${{ secrets.LISTINGRAIL_API_KEY }}
        run: |
          if [ -z "$LISTINGRAIL_API_KEY" ]; then
            echo "::error::LISTINGRAIL_API_KEY repo secret is missing; the weekly snapshot (and the Week-4 rent-cut unlock) cannot run."
            exit 1
          fi
      - run: python -m unittest tests.test_rent_drops
      - name: Fetch snapshot
        env:
          LISTINGRAIL_API_KEY: ${{ secrets.LISTINGRAIL_API_KEY }}
        run: python scripts/fetch_rent_drops.py
      - run: python -m unittest tests.test_rent_drops
      - name: Build /rent-drops/ pages from the new snapshot
        run: python scripts/build_rent_drops.py
      - run: python -m unittest tests.test_build_rent_drops
      - name: Commit snapshot
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data/rent-drops rent-drops
          git diff --staged --quiet || git commit -m "chore: weekly US metro rent-drop snapshot"
          git pull --rebase && git push
