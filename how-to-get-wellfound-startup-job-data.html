    <h1>How to get startup job listings from Wellfound (salary, equity and remote policy included)</h1>
    <p class="note">18 Nov 2026 · benthepythondev</p>

    <p>Wellfound, formerly AngelList Talent, lists jobs at startups and technology companies. Its public job records often include salary ranges, equity ranges, accepted remote regions and company size. General job boards often leave those details out. The <a href="https://apify.com/benthepythondev/wellfound-jobs-scraper">Wellfound Jobs Scraper</a> collects these public listings by city, country or region and returns one row for each job.</p>
    <p>You don't need a Wellfound login, a proxy or an API key.</p>

    <h2>What you get</h2>
    <p>Each row is one public job. In plain words, a row tells you:</p>
    <ul>
      <li><strong>The job itself:</strong> Wellfound job ID, link, title and the full public description, kept in its original markdown formatting.</li>
      <li><strong>Role and type:</strong> the job type (for example <code>full-time</code>) and the primary role (for example <code>Software Engineer</code>).</li>
      <li><strong>Where and how:</strong> the listed locations, accepted remote regions, whether the job is remote, the kind of remote, and whether work from home is flexible.</li>
      <li><strong>Experience:</strong> minimum and maximum years of experience, when the posting gives them.</li>
      <li><strong>Pay:</strong> the compensation text as Wellfound shows it, the salary minimum, salary maximum and currency, plus minimum and maximum equity percent.</li>
      <li><strong>Posting details:</strong> publication time, whether the job was auto-posted, and the ATS source.</li>
      <li><strong>The company:</strong> ID, name, slug, Wellfound profile URL, logo, size band (for example <code>SIZE_11_50</code>), a short summary, and hiring badges such as "Responds within a day".</li>
      <li><strong>Search context:</strong> a lead score, the location page the job came from, the keywords you searched, the job's rank in the results, the source URL and the time it was scraped.</li>
    </ul>

    <h2>What you can use it for</h2>
    <p>The README lists several uses. These four match the data most directly:</p>
    <ol>
      <li><strong>Find roles that disclose pay before you apply.</strong> Set <code>minimumSalary</code> and turn <code>includeJobsWithoutSalary</code> off. You then keep only jobs with a published salary range at or above your floor.</li>
      <li><strong>Build hiring signal lists for sales, recruiting or investment research.</strong> Company name, size, badges like "Actively Hiring" and the role category show you which startups are hiring and for what.</li>
      <li><strong>Compare remote work across startup markets.</strong> Run the same keywords against several locations and compare <code>is_remote</code>, <code>remote_kind</code> and <code>accepted_remote_locations</code>. For remote roles from other boards, see <a href="./how-to-get-remote-job-listings-from-six-job-boards.html">how to get remote job listings from six job boards</a>; for employers on Greenhouse, see <a href="./how-to-get-greenhouse-job-listings-data.html">how to get Greenhouse job listings</a>.</li>
      <li><strong>Feed a job alert, spreadsheet or labor market dashboard.</strong> Schedule the Actor on Apify and export results as JSON, CSV, Excel or XML, or read them through the dataset API.</li>
    </ol>

    <h2>Honest limits</h2>
    <ul>
      <li><strong>Public location pages only.</strong> The Actor reads the structured data that Wellfound publishes on its public location pages. It does not log in, so anything visible only to signed-in users is not included.</li>
      <li><strong>Keywords are broad.</strong> Keywords use an OR match against the title, full description, primary role, startup name and company summary. A row counts as a match if any one term appears anywhere in those fields. So a <code>python</code> search can return a job where Python is only a bonus skill.</li>
      <li><strong>Pay and equity are often missing.</strong> Many postings leave out salary or equity, and those fields come back as <code>null</code>. The minimum salary filter checks the lower bound of the published range.</li>
      <li><strong>Some fields are short or raw.</strong> <code>company_high_concept</code> can be cut off mid word (in the run we checked, a summary ending in "solutions" came back as "sol"). Descriptions keep markdown and can contain HTML entities such as <code>&amp;amp;</code>.</li>
      <li><strong><code>lead_score</code> is not explained in the README.</strong> Treat it as a rough ranking aid, not as a defined metric.</li>
      <li><strong>Results are capped.</strong> <code>maxResultsPerLocation</code> and <code>maxPagesPerLocation</code> limit how much comes back from each location. A job that shows up in several locations is saved once, matched by its Wellfound job ID.</li>
      <li><strong>It depends on Wellfound's page structure.</strong> If Wellfound changes how it publishes data on these pages, fields could change or go missing until the Actor is updated.</li>
    </ul>
